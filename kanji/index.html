<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanji Flashcards</title>
  
  <!-- Preload and fetch Google Fonts (Klee One) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --jp-font: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Kaku Gothic ProN", "Hiragino Kaku Gothic Pro", "Meiryo", "Yu Gothic", sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #111827; 
      color: #f3f4f6;            
    }

    /* Top Navigation */
    header {
      width: 100%;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      background-color: #1f2937;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header-title { font-size: 1.25rem; font-weight: bold; color: #f3f4f6; margin: 0; }

    .btn-settings {
      padding: 0.5rem 1rem;
      background-color: #374151;
      color: #e5e7eb;
      border: none;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }

    .btn-settings:hover { background-color: #4b5563; }

    /* Flashcard Area */
    main {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: hidden;
    }

    @media (min-width: 640px) { main { padding: 1.5rem; } }

    .card {
      width: 100%;
      max-width: 38rem;
      min-height: 24rem;
      max-height: 100%;
      background-color: #1f2937;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 640px) { .card { padding: 2rem; } }

    #card-front {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #card-back {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow: hidden;
    }

    .kanji-display {
      font-family: var(--jp-font);
      text-align: center;
      margin-bottom: 1rem;
      line-height: 1.2;
      font-size: 4.5rem;
    }

    @media (min-width: 640px) { .kanji-display { font-size: 5rem; } }

    hr { border: 0; border-top: 1px solid #374151; margin: 1rem 0; }

    /* Spoiler Style */
    .spoiler-container {
      text-align: left;
      font-size: 1.125rem;
      line-height: 1.625;
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .row-margin { margin-bottom: 10px; }

    .num-span {
      color: #9ca3af; 
      font-family: monospace;
      font-size: 0.875rem;
      margin-right: 0.25rem;
    }

    .comma-span { color: #6b7280; }

    .individual-spoiler {
      background-color: #374151; 
      color: #374151; /* Text hidden */
      padding: 2px 8px;
      margin: 0 0.25rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: inline-block;
      border: 1px solid #4b5563; 
      font-family: var(--jp-font);
    }

    .individual-spoiler.revealed {
      background-color: transparent;
      color: #f3f4f6; /* Text visible */
      border: 1px solid transparent;
    }

    /* Reading-Focused specific classes */
    .reading-group { margin-bottom: 1.25rem; }
    
    .expanded-container {
      display: none;
      padding-left: 0.75rem;
      border-left: 2px solid #4b5563;
      margin-left: 0.25rem;
      margin-top: 0.5rem;
    }
    
    .expanded-container.active { display: block; }

    .rep-label {
      font-weight: bold;
      color: #60a5fa;
      margin-right: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-family: var(--jp-font);
    }

    .rep-label:hover { text-decoration: underline; }

    .reading-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.5rem;
    }

    /* Controls */
    .controls-container { margin-top: 1.5rem; }

    #controls-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .btn-show-answer {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: white;
      font-size: 1.125rem;
      font-weight: bold;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      transition: background-color 0.15s ease-in-out;
    }

    @media (min-width: 640px) { .btn-show-answer { padding: 1rem; } }

    .btn-show-answer:hover { background-color: #3b82f6; }

    .pool-counts-display {
      color: #9ca3af;
      font-size: 0.875rem;
      font-family: monospace;
      letter-spacing: 0.05em;
    }

    #controls-back {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    @media (min-width: 640px) {
      #controls-back { grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
    }

    .grade-btn {
      padding: 0.75rem;
      font-weight: bold;
      border-radius: 0.25rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease-in-out;
      font-size: 1rem;
    }

    .grade-btn[data-pool="A"] { background-color: rgba(127, 29, 29, 0.4); color: #fca5a5; border-color: rgba(153, 27, 27, 0.5); }
    .grade-btn[data-pool="A"]:hover { background-color: rgba(127, 29, 29, 0.7); }
    .grade-btn[data-pool="H"] { background-color: rgba(124, 45, 18, 0.4); color: #fdba74; border-color: rgba(154, 52, 18, 0.5); }
    .grade-btn[data-pool="H"]:hover { background-color: rgba(124, 45, 18, 0.7); }
    .grade-btn[data-pool="N"] { background-color: rgba(30, 58, 138, 0.4); color: #93c5fd; border-color: rgba(30, 64, 175, 0.5); }
    .grade-btn[data-pool="N"]:hover { background-color: rgba(30, 58, 138, 0.7); }
    .grade-btn[data-pool="E"] { background-color: rgba(20, 83, 45, 0.4); color: #86efac; border-color: rgba(22, 101, 52, 0.5); }
    .grade-btn[data-pool="E"]:hover { background-color: rgba(20, 83, 45, 0.7); }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.active { display: flex; }

    .modal-content {
      width: 100%;
      max-width: 42rem;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background-color: #1f2937;
      border-radius: 0.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid #374151;
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem;
      border-bottom: 1px solid #374151;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1f2937;
    }

    .modal-header h2 { margin: 0; font-size: 1.125rem; font-weight: bold; color: white; }

    .btn-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      font-weight: bold;
    }
    .btn-close:hover { color: white; }

    .modal-body {
      padding: 1rem;
      overflow-y: auto;
      max-height: calc(90vh - 70px);
    }
    @media (min-width: 640px) { .modal-body { padding: 1.5rem; } }

    .modal-prompt { padding: 1.5rem; text-align: center; }
    .modal-prompt p { color: #9ca3af; font-size: 0.875rem; margin-bottom: 1.5rem; }
    .modal-prompt code { background-color: #374151; padding: 0.125rem 0.375rem; border-radius: 0.25rem; color: #e5e7eb; }

    .file-input-styled {
      display: block; width: 100%; font-size: 0.875rem; color: #9ca3af; cursor: pointer; margin-bottom: 1rem;
    }
    
    .file-input-styled::file-selector-button {
      margin-right: 1rem; padding: 0.5rem 1rem; border-radius: 0.25rem; border: 0; font-size: 0.875rem; font-weight: 600;
      background-color: rgba(30, 58, 138, 0.5); color: #bfdbfe; cursor: pointer;
    }

    /* Settings Elements */
    .settings-section { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #374151; }
    .settings-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .settings-section h3 { margin-top: 0; margin-bottom: 0.75rem; font-size: 1rem; font-weight: bold; color: #e5e7eb; }

    .action-buttons { display: flex; flex-wrap: wrap; gap: 0.75rem; }

    .btn-action {
      padding: 0.5rem 1rem; background-color: #2563eb; color: white; border: none; border-radius: 0.25rem;
      cursor: pointer; font-size: 0.875rem; font-weight: 500;
    }
    .btn-action:hover { background-color: #3b82f6; }

    .btn-secondary {
      display: inline-block; padding: 0.5rem 1rem; background-color: #374151; color: #e5e7eb; border: none;
      border-radius: 0.25rem; cursor: pointer; font-size: 0.875rem; font-weight: 500;
    }

    .input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; font-size: 0.875rem; }
    .input-grid label { display: block; color: #9ca3af; margin-bottom: 0.25rem; }
    .input-styled {
      width: 100%; background-color: #111827; border: 1px solid #4b5563; color: white; padding: 0.5rem;
      border-radius: 0.25rem; font-size: 0.875rem;
    }

    .pool-list {
      max-height: 12rem; overflow-y: auto; border: 1px solid #374151; border-radius: 0.25rem; background-color: #1f2937;
    }

    .pool-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; border-bottom: 1px solid #374151; }
    @media (min-width: 640px) { .pool-item { padding: 0.75rem; } }
    .pool-item:last-child { border-bottom: none; }
    .pool-item span { font-weight: bold; font-family: monospace; font-size: 1.125rem; color: #e5e7eb; }
    .pool-item select { background-color: #111827; border: 1px solid #4b5563; color: white; padding: 0.25rem; border-radius: 0.25rem; }

    .history-box {
      max-height: 8rem; overflow-y: auto; border: 1px solid #374151; border-radius: 0.25rem; padding: 0.75rem;
      font-size: 0.875rem; font-family: monospace; white-space: pre-wrap; color: #9ca3af; background-color: #111827;
    }

    .danger-text { color: #f87171; }
    .btn-danger {
      width: 100%; padding: 0.625rem; background-color: rgba(127, 29, 29, 0.6); border: 1px solid #991b1b; color: #fee2e2;
      border-radius: 0.25rem; font-weight: bold; font-size: 0.875rem; cursor: pointer;
    }
    .btn-danger:hover { background-color: rgba(153, 27, 27, 1); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <h1 class="header-title">Kanji Flashcards</h1>
    <button id="btn-open-settings" class="btn-settings">Settings</button>
  </header>

  <!-- Flashcard Area -->
  <main>
    <div class="card">
      <!-- Front: Kanji -->
      <div id="card-front">
        <div id="kanji-text" class="kanji-display" lang="ja"></div>
      </div>

      <!-- Back: Spoilers -->
      <div id="card-back" class="hidden">
        <hr>
        <div id="multi-spoiler-container" class="spoiler-container" lang="ja">
          <!-- Spoilers injected here via JS -->
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-container">
        <div id="controls-front">
          <button id="btn-show-answer" class="btn-show-answer">Show Answer</button>
          <div id="pool-counts" class="pool-counts-display"></div>
        </div>

        <div id="controls-back" class="hidden">
          <button class="grade-btn" data-pool="A">Again</button>
          <button class="grade-btn" data-pool="H">Hard</button>
          <button class="grade-btn" data-pool="N">Normal</button>
          <button class="grade-btn" data-pool="E">Easy</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Missing File Overlay -->
  <div id="file-prompt-modal" class="modal">
    <div class="modal-content" style="max-width: 28rem;">
      <div class="modal-prompt">
        <h2 style="margin-top: 0; color: white;">Notes File Required</h2>
        <p>Could not automatically load <code>anki_notes.txt</code>. Please select it manually below.</p>
        <input type="file" id="notes-file-input" accept=".txt" class="file-input-styled"/>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings & State Management</h2>
        <button id="btn-close-settings" class="btn-close">&times;</button>
      </div>
      
      <div class="modal-body">
        
        <!-- UI Toggle -->
        <div class="settings-section">
          <h3>Display Mode</h3>
          <label style="display: flex; align-items: center; cursor: pointer; color: #e5e7eb; font-size: 0.875rem;">
            <input type="checkbox" id="toggle-reading-mode" style="margin-right: 0.5rem; width: 1rem; height: 1rem;">
            Enable Reading-Focused Mode (Groups words by kanji reading)
          </label>
        </div>

        <!-- Session File IO -->
        <div class="settings-section">
          <h3>Session File</h3>
          <div class="action-buttons">
            <button id="btn-export-session" class="btn-action">Save Session to File</button>
            <label class="btn-secondary">
              Restore Session from File
              <input type="file" id="session-file-input" accept=".json" class="hidden">
            </label>
          </div>
        </div>

        <!-- Target Rates -->
        <div class="settings-section">
          <h3>Algorithm Tuning (Average appearances)</h3>
          <div class="input-grid">
            <div>
              <label>Again (A)</label>
              <input type="number" id="input-rate-a" class="input-styled">
            </div>
            <div>
              <label>Hard (H)</label>
              <input type="number" id="input-rate-h" class="input-styled">
            </div>
            <div>
              <label>Easy (E)</label>
              <input type="number" id="input-rate-e" class="input-styled">
            </div>
          </div>
        </div>

        <!-- Pool Editing -->
        <div class="settings-section">
          <h3>Manual Pool Assignments</h3>
          <input type="text" id="pool-search" placeholder="Search kanji..." class="input-styled" style="margin-bottom: 0.75rem;">
          <div id="pool-list" class="pool-list"></div>
        </div>

        <!-- History Viewer -->
        <div class="settings-section">
          <h3>History (Last <span id="history-count-display"></span> cards)</h3>
          <div id="history-list" class="history-box"></div>
        </div>

        <!-- Danger Zone -->
        <div>
          <h3 class="danger-text">Danger Zone</h3>
          <button id="btn-reset-session" class="btn-danger">Reset Entire Session</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Configurable Font List for the main Kanji display
    const KANJI_FONTS = [
      "var(--jp-font)",           // The default system font stack
      "'Klee One', sans-serif"    // Google Font: Klee One
      // Add more fonts here in the future! E.g., "'Yuji Syuku', serif"
    ];

    const CONSTANTS = {
      NOTES_FILENAME: 'anki_notes.txt',
      STORAGE_KEY: 'kanji_trainer_state',
      MAX_HISTORY: 1000,
      DEFAULT_RATES: { A: 10, H: 30, E: 1500 }
    };

    let rawNotes = {}; 
    let mixupGroups = {}; // Used to hold 'easy_to_mixup' relationships
    let state = {
      pools: {},
      history: [],
      rates: { ...CONSTANTS.DEFAULT_RATES },
      historyCounter: 0,
      readingFocusMode: true // Defaulted ON
    };

    let currentCardKanji = null;

    // Linguistic helper tools (mirrors Python logic)
    function applyXtsu(r) {
      if (!r) return r;
      let last = r[r.length - 1].toLowerCase();
      if ("bcdfghjklmpqrstvwxyz".includes(last) && last !== 'n') {
        return r.slice(0, -1) + "xtsu";
      }
      return r;
    }

    function devoice(r) {
      if (!r) return r;
      let lower = r.toLowerCase();
      const prefixes = { 'ji': 'shi', 'di': 'chi', 'du': 'tsu', 'zu': 'su' };
      for (const v in prefixes) {
        if (lower.startsWith(v)) return prefixes[v] + lower.slice(v.length);
      }
      if (lower.startsWith('g')) return 'k' + lower.slice(1);
      if (lower.startsWith('z')) return 's' + lower.slice(1);
      if (lower.startsWith('d')) return 't' + lower.slice(1);
      if (lower.startsWith('b') || lower.startsWith('p') || lower.startsWith('f')) return 'h' + lower.slice(1);
      if (lower.startsWith('j')) return 'sh' + lower.slice(1);
      return lower;
    }

    function loadState() {
      const saved = localStorage.getItem(CONSTANTS.STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.pools = parsed.pools || {};
          state.history = parsed.history || [];
          state.rates = parsed.rates || { ...CONSTANTS.DEFAULT_RATES };
          state.historyCounter = parsed.historyCounter || state.history.length;
          state.readingFocusMode = parsed.readingFocusMode !== undefined ? parsed.readingFocusMode : true;
        } catch (e) {
          console.error("Failed to parse local storage state", e);
        }
      }
    }

    function saveState() {
      localStorage.setItem(CONSTANTS.STORAGE_KEY, JSON.stringify(state));
    }

    function parseNotesData(text) {
      const lines = text.split('\n');
      const parsedNotes = {};
      lines.forEach(line => {
        const parts = line.split('|').map(s => s.trim());
        if (parts.length >= 4 && parts[0]) {
          parsedNotes[parts[0]] = {
            kanji: parts[0],
            words: parts[1],
            kana: parts[2],
            english: parts[3],
            readings: parts[4] || "" 
          };
        }
      });
      return parsedNotes;
    }

    function parseMixups(text) {
      const lines = text.split('\n');
      lines.forEach(line => {
        const group = line.trim().split('');
        if (group.length > 1) {
          group.forEach(kanji => {
            mixupGroups[kanji] = group;
          });
        }
      });
    }

    function syncNotesWithState(newNotes) {
      rawNotes = newNotes;
      const validKanjis = new Set(Object.keys(rawNotes));
      let stateChanged = false;

      for (const kanji in state.pools) {
        if (!validKanjis.has(kanji)) {
          delete state.pools[kanji];
          stateChanged = true;
        }
      }

      for (const kanji in rawNotes) {
        if (!state.pools[kanji]) {
          state.pools[kanji] = 'A';
          stateChanged = true;
        }
      }
      if (stateChanged) saveState();
    }

    function chooseNextCard() {
      const availableKanjis = Object.keys(rawNotes);
      if (availableKanjis.length === 0) return null;

      const poolLists = { A: [], H: [], N: [], E: [] };
      availableKanjis.forEach(k => {
        const pool = state.pools[k] || 'A';
        poolLists[pool].push(k);
      });

      const pA = poolLists.A.length / state.rates.A;
      const pH = poolLists.H.length / state.rates.H;
      const pE = poolLists.E.length / state.rates.E;
      const sumP = pA + pH + pE;

      let r = Math.random();
      let selectedPool = 'N';

      if (pA >= 1) {
        selectedPool = 'A';
      } else if (pA + pH >= 1) {
        r = r * (pA + pH);
        if (r < pA) selectedPool = 'A';
        else selectedPool = 'H';
      } else if (sumP >= 1) {
        r = r * sumP;
        if (r < pA) selectedPool = 'A';
        else if (r < pA + pH) selectedPool = 'H';
        else selectedPool = 'E';
      } else {
        if (r < pA) selectedPool = 'A';
        else if (r < pA + pH) selectedPool = 'H';
        else if (r < sumP) selectedPool = 'E';
        else selectedPool = 'N';
      }

      if (poolLists[selectedPool].length === 0) {
        const fallbacks = ['N', 'A', 'H', 'E'];
        for (let fb of fallbacks) {
          if (poolLists[fb].length > 0) {
            selectedPool = fb;
            break;
          }
        }
      }

      const list = poolLists[selectedPool];
      return list[Math.floor(Math.random() * list.length)];
    }

    const elFront = document.getElementById('card-front');
    const elBack = document.getElementById('card-back');
    const elControlsFront = document.getElementById('controls-front');
    const elControlsBack = document.getElementById('controls-back');
    const elKanjiText = document.getElementById('kanji-text');
    const elSpoilerContainer = document.getElementById('multi-spoiler-container');
    const elPoolCounts = document.getElementById('pool-counts');

    function renderNextCard() {
      let chosen = chooseNextCard();

      // Intercept and handle easy_to_mixup logic randomly
      if (chosen && mixupGroups[chosen]) {
        // Filter the mixup group to ensure the kanji actually exists in our deck
        const validMixups = mixupGroups[chosen].filter(k => rawNotes[k]);
        if (validMixups.length > 0) {
          chosen = validMixups[Math.floor(Math.random() * validMixups.length)];
        }
      }

      currentCardKanji = chosen;

      if (!currentCardKanji) {
        elKanjiText.innerText = "No cards available.";
        elControlsFront.classList.add('hidden');
        return;
      }

      const counts = { A: 0, H: 0, N: 0, E: 0 };
      for (const k in rawNotes) { counts[state.pools[k] || 'A']++; }
      elPoolCounts.innerText = `A: ${counts.A} | H: ${counts.H} | N: ${counts.N} | E: ${counts.E}`;

      // Randomize display font for the kanji
      const randomFont = KANJI_FONTS[Math.floor(Math.random() * KANJI_FONTS.length)];
      elKanjiText.style.fontFamily = randomFont;

      elKanjiText.innerText = currentCardKanji;
      elBack.classList.add('hidden');
      elControlsBack.classList.add('hidden');
      elControlsFront.classList.remove('hidden');
      elSpoilerContainer.innerHTML = '';
    }

    function showAnswer() {
      if (!currentCardKanji) return;
      const note = rawNotes[currentCardKanji];

      const parseField = (text) => text ? text.split(';').map(s => s.trim()).filter(s => s !== "") : [];
      
      const wordsArr = parseField(note.words);
      const kanaRawArr = parseField(note.kana);
      const kanaArr = kanaRawArr.map(s => s.replace(/`/g, ''));
      const englishArr = parseField(note.english);
      const readingsData = note.readings || "";

      elSpoilerContainer.innerHTML = '';

      if (state.readingFocusMode && readingsData) {
        
        // Parse Reading Groups
        const groups = parseField(readingsData).map(g => {
          const [label, wordsStr] = g.split(':');
          return { label, words: wordsStr.split(',').filter(Boolean) };
        });

        // Helper to find the specific word occurrence that matches this reading group.
        // Replaces the old wordMap which overwrote duplicate words with different readings.
        const getWordData = (targetWord, groupLabel) => {
          let bestMatch = null;
          
          for (let i = 0; i < wordsArr.length; i++) {
            if (wordsArr[i] === targetWord) {
              const data = { kanaRaw: kanaRawArr[i] || '', kana: kanaArr[i] || '', eng: englishArr[i] || '' };
              if (!bestMatch) bestMatch = data; // Keep the first occurrence as a fallback
              
              const kanjisInWord = targetWord.split('').filter(c => c.match(/[\u4E00-\u9FAF]/));
              const targetIndex = kanjisInWord.indexOf(currentCardKanji);
              
              if (targetIndex !== -1 && data.kanaRaw.includes('`')) {
                const segments = [];
                const regex = /`([^`]+)`/g;
                let match;
                while ((match = regex.exec(data.kanaRaw)) !== null) {
                  segments.push(match[1]);
                }
                
                const numKanjis = kanjisInWord.length;
                if (numKanjis > 0 && segments.length % numKanjis === 0) {
                  for (let j = targetIndex; j < segments.length; j += numKanjis) {
                    if (devoice(applyXtsu(segments[j])) === devoice(groupLabel)) {
                      return data; // Perfect reading match found!
                    }
                  }
                } else if (targetIndex < segments.length) {
                  if (devoice(applyXtsu(segments[targetIndex])) === devoice(groupLabel)) {
                    return data; // Perfect reading match found!
                  }
                }
              }
            }
          }
          return bestMatch || { kanaRaw: '', kana: '?', eng: '?' };
        };

        // Dynamic Kanja reconstruction: When python deduplicated words, it might have dropped alternative kana.
        // E.g. word "弾く", rawKana "`haji`ku", groupLabel "hi". We replace "haji" with "hi" -> "hiku".
        const getDisplayKana = (w, wData, groupLabel) => {
          let dKana = wData.kana;
          const kanjisInWord = w.split('').filter(c => c.match(/[\u4E00-\u9FAF]/));
          const targetIndex = kanjisInWord.indexOf(currentCardKanji);
          
          if (targetIndex !== -1 && wData.kanaRaw.includes('`')) {
            const segments = [];
            const regex = /`([^`]+)`/g;
            let match;
            while ((match = regex.exec(wData.kanaRaw)) !== null) {
              segments.push({ text: match[1], index: match.index, length: match[0].length });
            }
            
            const numKanjis = kanjisInWord.length;
            if (numKanjis > 0 && segments.length % numKanjis === 0) {
              let hasMatchingReading = false;
              for (let i = targetIndex; i < segments.length; i += numKanjis) {
                if (devoice(applyXtsu(segments[i].text)) === devoice(groupLabel)) {
                  hasMatchingReading = true;
                  break;
                }
              }
              if (!hasMatchingReading) {
                const before = wData.kanaRaw.substring(0, segments[targetIndex].index);
                const after = wData.kanaRaw.substring(segments[targetIndex].index + segments[targetIndex].length);
                dKana = (before + groupLabel + after).replace(/`/g, '');
              }
            } else if (targetIndex < segments.length) {
              const origReading = segments[targetIndex].text;
              // Only replace if the base/unvoiced phonetic genuinely mismatches (e.g. koumuru vs kaburu)
              if (devoice(applyXtsu(origReading)) !== devoice(groupLabel)) {
                const before = wData.kanaRaw.substring(0, segments[targetIndex].index);
                const after = wData.kanaRaw.substring(segments[targetIndex].index + segments[targetIndex].length);
                dKana = (before + groupLabel + after).replace(/`/g, '');
              }
            }
          }
          return dKana;
        };

        groups.forEach((group) => {
          if (group.words.length === 0) return;
          
          const groupDiv = document.createElement('div');
          groupDiv.className = "reading-group";

          // Random representative
          const repWord = group.words[Math.floor(Math.random() * group.words.length)];
          const orderedOthers = group.words.filter(w => w !== repWord);

          // Build Collapsed View (Just the Spoilered Rep)
          const collapsedDiv = document.createElement('div');
          const repSpoiler = document.createElement('span');
          repSpoiler.className = 'individual-spoiler';
          repSpoiler.innerText = repWord;
          collapsedDiv.appendChild(repSpoiler);

          // Build Expanded View (Unspoilered Rep + Other Words)
          const expandedDiv = document.createElement('div');
          expandedDiv.className = "expanded-container";

          // Row 1: Unspoilered Rep Word + Kana + Eng
          const repRow = document.createElement('div');
          repRow.className = "reading-row";
          
          const repLabel = document.createElement('span');
          repLabel.className = 'rep-label';
          repLabel.innerText = repWord;
          
          const rData = getWordData(repWord, group.label);
          const rKanaDisplay = getDisplayKana(repWord, rData, group.label);
          
          const rKana = document.createElement('span'); rKana.className = 'individual-spoiler'; rKana.innerText = rKanaDisplay;
          const rEng = document.createElement('span'); rEng.className = 'individual-spoiler'; rEng.innerText = rData.eng;
          
          repRow.appendChild(repLabel);
          repRow.appendChild(rKana);
          
          const comma = document.createElement('span');
          comma.className = "comma-span";
          comma.innerText = ", ";
          repRow.appendChild(comma);
          repRow.appendChild(rEng);
          expandedDiv.appendChild(repRow);

          // Row 2+: Other words in the group
          orderedOthers.forEach(w => {
            const oRow = document.createElement('div');
            oRow.className = "reading-row";
            
            const oWord = document.createElement('span'); oWord.className = 'individual-spoiler'; oWord.innerText = w;
            const oData = getWordData(w, group.label);
            const oKanaDisplay = getDisplayKana(w, oData, group.label);
            
            const oKana = document.createElement('span'); oKana.className = 'individual-spoiler'; oKana.innerText = oKanaDisplay;
            const oEng = document.createElement('span'); oEng.className = 'individual-spoiler'; oEng.innerText = oData.eng;
            
            oRow.appendChild(oWord);
            oRow.appendChild(oKana);
            
            const oComma = document.createElement('span');
            oComma.className = "comma-span";
            oComma.innerText = ", ";
            oRow.appendChild(oComma);
            oRow.appendChild(oEng);
            expandedDiv.appendChild(oRow);

            // Toggle spoilers for other words
            [oWord, oKana, oEng].forEach(el => {
              el.onclick = function(e) {
                if (window.getSelection().toString().length > 0) return;
                this.classList.toggle('revealed');
              }
            });
          });

          // Toggles logic between collapsed/expanded states
          repSpoiler.onclick = function(e) {
            if (window.getSelection().toString().length > 0) return;
            collapsedDiv.classList.add('hidden');
            expandedDiv.classList.add('active');
          };
          
          repLabel.onclick = function(e) {
            if (window.getSelection().toString().length > 0) return;
            expandedDiv.classList.remove('active');
            collapsedDiv.classList.remove('hidden');
          };

          [rKana, rEng].forEach(el => {
            el.onclick = function(e) {
              if (window.getSelection().toString().length > 0) return;
              this.classList.toggle('revealed');
            }
          });

          groupDiv.appendChild(collapsedDiv);
          groupDiv.appendChild(expandedDiv);
          elSpoilerContainer.appendChild(groupDiv);
        });

      } else {
        // Classic mode / Fallback for old data
        const maxRows = Math.max(wordsArr.length, kanaArr.length, englishArr.length);
        for (let i = 0; i < maxRows; i++) {
          const rowDiv = document.createElement('div');
          rowDiv.className = "row-margin reading-row";
          
          const numSpan = document.createElement('b');
          numSpan.className = "num-span";
          numSpan.innerText = `${i + 1}:`;
          rowDiv.appendChild(numSpan);

          const rowData = [wordsArr[i], kanaArr[i], englishArr[i]];

          rowData.forEach((text, index) => {
            if (text) {
              const span = document.createElement('span');
              span.className = 'individual-spoiler';
              span.innerText = text;
              span.onclick = function(e) { 
                if (window.getSelection().toString().length > 0) return;
                this.classList.toggle('revealed'); 
              };
              rowDiv.appendChild(span);

              if (index < 2 && rowData[index + 1]) {
                const comma = document.createElement('span');
                comma.className = "comma-span";
                comma.innerText = ", ";
                rowDiv.appendChild(comma);
              }
            }
          });
          elSpoilerContainer.appendChild(rowDiv);
        }
      }

      // Show Controls
      elControlsFront.classList.add('hidden');
      elBack.classList.remove('hidden');
      elControlsBack.classList.remove('hidden');
    }

    function gradeCard(pool) {
      if (!currentCardKanji) return;
      state.pools[currentCardKanji] = pool;
      state.historyCounter++;
      state.history.push({ id: state.historyCounter, kanji: currentCardKanji, pool: pool });
      if (state.history.length > CONSTANTS.MAX_HISTORY) state.history.shift();
      saveState();
      renderNextCard();
    }

    /* Settings UI */
    const modalSettings = document.getElementById('settings-modal');
    
    function updateSettingsUI() {
      document.getElementById('toggle-reading-mode').checked = state.readingFocusMode;
      document.getElementById('input-rate-a').value = state.rates.A;
      document.getElementById('input-rate-h').value = state.rates.H;
      document.getElementById('input-rate-e').value = state.rates.E;

      const histContainer = document.getElementById('history-list');
      document.getElementById('history-count-display').innerText = state.history.length;
      const reversedHistory = [...state.history].reverse();
      histContainer.innerHTML = reversedHistory.map((h, i) => `${i + 1}: ${h.kanji}${h.pool}`).join('\n');
      histContainer.scrollTop = 0; 
      renderPoolList();
    }

    function renderPoolList(filterText = "") {
      const container = document.getElementById('pool-list');
      container.innerHTML = '';
      const filteredKeys = Object.keys(state.pools).filter(k => k.includes(filterText));
      
      filteredKeys.forEach(kanji => {
        const currentPool = state.pools[kanji];
        const row = document.createElement('div');
        row.className = "pool-item";
        
        const label = document.createElement('span');
        label.innerText = kanji;
        label.lang = "ja";
        
        const select = document.createElement('select');
        ['A', 'H', 'N', 'E'].forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.innerText = opt;
          if (opt === currentPool) option.selected = true;
          select.appendChild(option);
        });

        select.addEventListener('change', (e) => {
          state.pools[kanji] = e.target.value;
          saveState();
        });

        row.appendChild(label);
        row.appendChild(select);
        container.appendChild(row);
      });
    }

    document.getElementById('btn-open-settings').addEventListener('click', () => {
      updateSettingsUI();
      modalSettings.classList.add('active');
    });

    document.getElementById('btn-close-settings').addEventListener('click', () => {
      state.readingFocusMode = document.getElementById('toggle-reading-mode').checked;
      const vA = parseInt(document.getElementById('input-rate-a').value) || CONSTANTS.DEFAULT_RATES.A;
      const vH = parseInt(document.getElementById('input-rate-h').value) || CONSTANTS.DEFAULT_RATES.H;
      const vE = parseInt(document.getElementById('input-rate-e').value) || CONSTANTS.DEFAULT_RATES.E;
      state.rates = { A: vA, H: vH, E: vE };
      saveState();
      modalSettings.classList.remove('active');
    });

    document.getElementById('pool-search').addEventListener('input', (e) => {
      renderPoolList(e.target.value);
    });

    document.getElementById('btn-reset-session').addEventListener('click', () => {
      if (confirm("Are you absolutely sure you want to reset your session?\n\nThis will permanently delete your pool assignments, history, and algorithm settings. This action cannot be undone.")) {
        localStorage.removeItem(CONSTANTS.STORAGE_KEY);
        location.reload();
      }
    });

    document.getElementById('btn-export-session').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", "kanji_session.json");
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    });

    document.getElementById('session-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const importedState = JSON.parse(evt.target.result);
          if (importedState.pools && importedState.rates) {
            state = importedState;
            syncNotesWithState(rawNotes);
            updateSettingsUI();
            alert("Session restored successfully.");
          }
        } catch(err) {
          alert("Invalid session file.");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('btn-show-answer').addEventListener('click', showAnswer);
    document.querySelectorAll('.grade-btn').forEach(btn => {
      btn.addEventListener('click', (e) => gradeCard(e.target.dataset.pool));
    });

    function initAppWithNotes(textData) {
      document.getElementById('file-prompt-modal').classList.remove('active');
      loadState();
      const parsedNotes = parseNotesData(textData);
      syncNotesWithState(parsedNotes);
      renderNextCard();
    }

    // Simultaneously attempt to load anki_notes.txt and easy_to_mixup
    // Adding a cache-buster query parameter to bypass aggressive mobile browser caching
    const cacheBuster = '?t=' + Date.now();
    Promise.allSettled([
      fetch(CONSTANTS.NOTES_FILENAME + cacheBuster, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(); return r.text(); }),
      fetch('easy_to_mixup' + cacheBuster, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(); return r.text(); }),
      fetch('easy_to_mixup.txt' + cacheBuster, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(); return r.text(); }) // Optional fallback for txt extension
    ]).then(results => {
      const [notesRes, mixupsRes, mixupsTxtRes] = results;

      if (mixupsRes.status === 'fulfilled') {
        parseMixups(mixupsRes.value);
      } else if (mixupsTxtRes.status === 'fulfilled') {
        parseMixups(mixupsTxtRes.value);
      }

      if (notesRes.status === 'fulfilled') {
        initAppWithNotes(notesRes.value);
      } else {
        console.warn("Could not fetch notes automatically. Showing manual file prompt.");
        document.getElementById('file-prompt-modal').classList.add('active');
      }
    });

    document.getElementById('notes-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) { initAppWithNotes(evt.target.result); };
      reader.readAsText(file);
    });

  </script>
</body>
</html>
